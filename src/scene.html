<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matrix Rain scene</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #020604;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="rain" aria-hidden="true"></canvas>
    <script>
      const canvas = document.getElementById("rain");
      const ctx = canvas.getContext("2d");
      const motion = matchMedia("(prefers-reduced-motion: reduce)");
      const glyphs =
        "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789";
      const size = 18;
      const pointer = { x: 0, y: 0, active: false };
      let width, height, columns, timer;

      function resize() {
        width = innerWidth;
        height = innerHeight;
        const scale = Math.min(devicePixelRatio || 1, 2);
        canvas.width = width * scale;
        canvas.height = height * scale;
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        ctx.font = `${size}px monospace`;
        columns = Array.from({ length: Math.ceil(width / size) }, () => ({
          y: Math.random() * height,
          speed: 0.6 + Math.random() * 1.4,
        }));
        ctx.fillStyle = "#020604";
        ctx.fillRect(0, 0, width, height);
        if (motion.matches) draw(true);
      }

      function draw(still = false) {
        ctx.fillStyle = still ? "#020604" : "rgba(2, 6, 4, 0.12)";
        ctx.fillRect(0, 0, width, height);
        for (let i = 0; i < columns.length; i++) {
          const column = columns[i];
          const x = i * size;
          const distance = Math.hypot(x - pointer.x, column.y - pointer.y);
          const displacement =
            pointer.active && distance < 100
              ? (x < pointer.x ? -1 : 1) * (100 - distance) * 0.45
              : 0;
          ctx.fillStyle = Math.random() > 0.96 ? "#b4ffd0" : "#248d46";
          ctx.fillText(
            glyphs[Math.floor(Math.random() * glyphs.length)],
            x + displacement,
            column.y,
          );
          if (!still) column.y += size * column.speed;
          if (column.y > height + 100 && Math.random() > 0.95) column.y = -size;
        }
      }

      function schedule() {
        clearInterval(timer);
        if (motion.matches) draw(true);
        else if (!document.hidden) timer = setInterval(draw, 80);
      }
      addEventListener("message", ({ data }) => {
        if (data?.type === "t3-theme-scene:pointer")
          Object.assign(pointer, { x: data.x, y: data.y, active: true });
        else if (data?.type === "t3-theme-scene:pointer-leave")
          pointer.active = false;
      });
      addEventListener("resize", resize);
      motion.addEventListener("change", schedule);
      document.addEventListener("visibilitychange", schedule);
      resize();
      schedule();
    </script>
  </body>
</html>
